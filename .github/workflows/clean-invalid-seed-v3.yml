name: Clean Invalid Seed V3

on:
  push:
    branches: [main]
    paths: ['plugins.v3/cleaninvalidseed/**', 'tests/v3/cleaninvalidseed/**', 'package.v3.json', '.github/workflows/clean-invalid-seed-v3.yml']
  pull_request:
    paths: ['plugins.v3/cleaninvalidseed/**', 'tests/v3/cleaninvalidseed/**', 'package.v3.json', '.github/workflows/clean-invalid-seed-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest apscheduler
      - run: python -m compileall -q plugins.v3/cleaninvalidseed
      - run: python .github/scripts/check_plugin_versions.py package.v3.json
      - name: Check scoped federation assets
        run: |
          mkdir -p "$RUNNER_TEMP/cleanseed-gate/plugins.v3"
          cp package.v3.json "$RUNNER_TEMP/cleanseed-gate/"
          cp -R plugins.v3/cleaninvalidseed "$RUNNER_TEMP/cleanseed-gate/plugins.v3/"
          python .github/scripts/check_federation_css.py --root "$RUNNER_TEMP/cleanseed-gate"
      - run: python -m pytest -q tests/v3/cleaninvalidseed
      - run: npm --prefix plugins.v3/cleaninvalidseed run check
      - run: npm --prefix plugins.v3/cleaninvalidseed run build
      - run: node --test tests/v3/cleaninvalidseed/test_cleanseed_ui.mjs
      - run: git diff --exit-code -- plugins.v3/cleaninvalidseed/dist
      - run: git diff --check
      - name: Build standard plugin asset
        id: version
        run: |
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          version = json.loads(Path('package.v3.json').read_text())['CleanInvalidSeed']['version']
          root = Path('plugins.v3')
          with zipfile.ZipFile(f'cleaninvalidseed_v{version}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted((root/'cleaninvalidseed').rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and not path.name.startswith('._'):
                      archive.write(path, path.relative_to(root))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clean-invalid-seed-plugin
          path: cleaninvalidseed_v*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clean-invalid-seed-plugin
      - name: Publish plugin version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.check.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tag="CleanInvalidSeed_v${PLUGIN_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" "cleaninvalidseed_v${PLUGIN_VERSION}.zip" \
            --target "$COMMIT_SHA" --title "清理无效做种 ${PLUGIN_VERSION}" \
            --notes 'MoviePilot V3 做种复核工作台：修复下载器离线、跨下载器及路径误判，增加持续观察、真实做种时长、回读确认和可恢复源文件回收区。升级默认只预览，保留原周期、映射与排除规则。'
